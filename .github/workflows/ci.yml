name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Use Maven from setup-java — skeleton mvnw jar is incomplete/corrupt
      - name: Build and test
        run: mvn -B -DskipTests=false test package
