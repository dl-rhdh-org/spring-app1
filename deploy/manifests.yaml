# Allow OpenShift GitOps to manage resources in this namespace (sync before workloads)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-application-controller-admin
  namespace: spring-demos1
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app1
  namespace: spring-demos1
  labels:
    app: spring-app1
    backstage.io/kubernetes-id: spring-app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-app1
  template:
    metadata:
      labels:
        app: spring-app1
        backstage.io/kubernetes-id: spring-app1
    spec:
      containers:
        - name: app
          # Demo image — replace with Quay-built image once CI push is enabled
          # Tag "latest" does not exist on this repo; use a real tag.
          image: quay.io/openshifttest/hello-openshift:1.2.0
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: spring-app1
  namespace: spring-demos1
  labels:
    app: spring-app1
    backstage.io/kubernetes-id: spring-app1
spec:
  selector:
    app: spring-app1
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: spring-app1
  namespace: spring-demos1
spec:
  to:
    kind: Service
    name: spring-app1
  port:
    targetPort: http
  tls:
    termination: edge
